name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug applications, run lint, and verify screenshots
        run: ./gradlew :app:assembleDebug :app-resonote-catalog:assembleDebug lint verifyRoborazziDebug

      - name: Upload Roborazzi failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-failure-${{ github.run_id }}
          path: |
            **/build/outputs/roborazzi/
            **/build/reports/roborazzi/
            **/build/test-results/roborazzi/
          if-no-files-found: ignore
          retention-days: 7
