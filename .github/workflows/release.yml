name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'JamesGZM/Resonote'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    env:
      RESONOTE_KEYSTORE_PATH: keystore/resonote-release.jks
      RESONOTE_KEYSTORE_PASSWORD: ${{ secrets.RESONOTE_KEYSTORE_PASSWORD }}
      RESONOTE_KEY_ALIAS: ${{ secrets.RESONOTE_KEY_ALIAS }}
      RESONOTE_KEY_PASSWORD: ${{ secrets.RESONOTE_KEY_PASSWORD }}
      RESONOTE_RELEASE_CERT_SHA256: 84df8ad7c7f07596dcc90ecdc1c53dcc15f3d6ad8aacb8b554eb5420d74bad68

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^resonoteVersionName=//p' gradle.properties)"
          version_code="$(sed -n 's/^resonoteVersionCode=//p' gradle.properties)"
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${GITHUB_REF_NAME}" = "v${version_name}"
          [[ "${version_code}" =~ ^[1-9][0-9]*$ ]]
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          echo "name=${version_name}" >> "${GITHUB_OUTPUT}"

      - name: Restore release keystore
        shell: bash
        env:
          RESONOTE_KEYSTORE_BASE64: ${{ secrets.RESONOTE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${RESONOTE_KEYSTORE_BASE64:?Missing release keystore secret}"
          : "${RESONOTE_KEYSTORE_PASSWORD:?Missing keystore password secret}"
          : "${RESONOTE_KEY_ALIAS:?Missing key alias secret}"
          : "${RESONOTE_KEY_PASSWORD:?Missing key password secret}"
          mkdir -p keystore
          printf '%s' "${RESONOTE_KEYSTORE_BASE64}" | base64 --decode > "${RESONOTE_KEYSTORE_PATH}"
          chmod 600 "${RESONOTE_KEYSTORE_PATH}"
          actual_fingerprint="$(
            keytool -exportcert \
              -keystore "${RESONOTE_KEYSTORE_PATH}" \
              -alias "${RESONOTE_KEY_ALIAS}" \
              -storepass:env RESONOTE_KEYSTORE_PASSWORD \
              -rfc |
              openssl x509 -noout -fingerprint -sha256 |
              cut -d= -f2 |
              tr -d ':' |
              tr '[:upper:]' '[:lower:]'
          )"
          test "${actual_fingerprint}" = "${RESONOTE_RELEASE_CERT_SHA256}"

      - name: Verify project and build release artifacts
        run: ./gradlew check verifyRoborazziDebug :app:assembleRelease :app:bundleRelease

      - name: Upload Roborazzi failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-failure-${{ github.run_id }}
          path: |
            **/build/outputs/roborazzi/
            **/build/reports/roborazzi/
            **/build/test-results/roborazzi/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify and prepare release artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.name }}"
          apk="app/build/outputs/apk/release/app-release.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "${apksigner}"
          "${apksigner}" verify --verbose --print-certs "${apk}"
          jarsigner -verify "${aab}"
          mkdir -p dist
          cp "${apk}" "dist/Resonote-${version}.apk"
          cp "${aab}" "dist/Resonote-${version}.aab"
          (cd dist && sha256sum Resonote-* > SHA256SUMS.txt)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Resonote-${{ steps.version.outputs.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Create draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft > release-draft-state; then
            test "$(< release-draft-state)" = "true"
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --draft \
              --generate-notes \
              --title "Resonote ${{ steps.version.outputs.name }}" \
              --verify-tag
          fi
