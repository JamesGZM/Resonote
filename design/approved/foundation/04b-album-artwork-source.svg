<rect width="1597" height="985" class="bg"/>
<text x="30" y="60" class="mast ink">RESONOTE</text>
<text x="850" y="53" class="title ink">04B / ALBUM ARTWORK</text>
<text x="1565" y="38" text-anchor="end" class="small ink">CONTAINER / 1:1 · CROP · CENTER</text>
<text x="1565" y="62" text-anchor="end" class="small ink">STATE / LOADING · LOADED · FALLBACK</text>
<line x1="30" y1="84" x2="1567" y2="84" class="rule"/>
<line x1="535" y1="125" x2="535" y2="870" class="rule"/>
<line x1="1055" y1="125" x2="1055" y2="870" class="rule"/>

<text x="35" y="145" class="head rose">01</text>
<text x="82" y="145" class="head ink">RATIO &amp; SHAPE</text>
<text x="575" y="145" class="head rose">02</text>
<text x="622" y="145" class="head ink">EXTREME SOURCE CROP</text>
<text x="1090" y="145" class="head rose">03</text>
<text x="1137" y="145" class="head ink">STATE MODEL</text>

<!-- 01: one artwork, consistent square containers -->
<g clip-path="url(#coverMainClip)">
  <rect x="78" y="220" width="282" height="282" fill="url(#coverAGrad)"/>
  <circle cx="310" cy="270" r="118" fill="#FFD9DD" opacity=".35"/>
  <circle cx="200" cy="385" r="92" fill="#201A1B" opacity=".84"/>
  <path d="M80 475L360 265V505H80Z" fill="#FFFBFF" opacity=".2"/>
  <circle cx="200" cy="385" r="28" fill="#FFB1C0"/>
</g>
<rect x="78" y="220" width="282" height="282" rx="34" fill="none" stroke="#847374" stroke-width="1.5"/>
<text x="78" y="540" class="label ink">STANDARD / 1:1</text>
<text x="78" y="570" class="label rose">SHAPE MEDIUM / 12dp</text>

<g clip-path="url(#coverSmallClip)">
  <rect x="78" y="620" width="112" height="112" fill="url(#coverAGrad)"/>
  <circle cx="170" cy="640" r="46" fill="#FFD9DD" opacity=".35"/>
  <circle cx="126" cy="687" r="36" fill="#201A1B" opacity=".84"/>
</g>
<rect x="78" y="620" width="112" height="112" rx="14" fill="none" stroke="#847374"/>
<g clip-path="url(#coverCompactClip)">
