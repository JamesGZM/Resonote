  <path d="M218 700Q270 630 330 650V732H218Z" fill="#201A1B" opacity=".66"/>
  <circle cx="290" cy="666" r="23" fill="#E6F2FF" opacity=".7"/>
</g>
<rect x="218" y="620" width="112" height="112" rx="10" fill="none" stroke="#847374"/>
<text x="78" y="770" class="small ink">DEFAULT / 12dp</text>
<text x="218" y="770" class="small ink">COMPACT / 8dp</text>
<text x="78" y="815" class="small muted">SAME MEDIA · SAME CROP RULE</text>
<text x="78" y="845" class="small muted">SIZE IS DEFINED BY COMPONENTS</text>

<!-- 02: wide and portrait inputs, both center-cropped into square -->
<svg x="575" y="222" width="84" height="210" viewBox="0 0 240 600" preserveAspectRatio="xMidYMid meet">
  <rect width="240" height="600" fill="url(#portraitGrad)"/>
  <circle cx="120" cy="180" r="78" fill="#E9FFD4" opacity=".55"/>
  <path d="M0 470Q105 270 240 390V600H0Z" fill="#15382E"/>
  <path d="M70 70L190 530" stroke="#FFFBFF" stroke-width="24" opacity=".35"/>
</svg>
<rect x="575" y="222" width="84" height="210" fill="none" stroke="#847374"/>
<rect x="575" y="285" width="84" height="84" class="guide"/>
<path d="M659 327H704" class="guide"/>
<g clip-path="url(#wideCropClip)">
  <svg x="704" y="202" width="250" height="250" viewBox="0 0 240 600" preserveAspectRatio="xMidYMid slice">
    <rect width="240" height="600" fill="url(#portraitGrad)"/>
    <circle cx="120" cy="180" r="78" fill="#E9FFD4" opacity=".55"/>
    <path d="M0 470Q105 270 240 390V600H0Z" fill="#15382E"/>
    <path d="M70 70L190 530" stroke="#FFFBFF" stroke-width="24" opacity=".35"/>
  </svg>
</g>
<rect x="704" y="202" width="250" height="250" rx="22" fill="none" stroke="#847374" stroke-width="1.5"/>
<text x="575" y="480" class="small ink">PORTRAIT INPUT</text>
<text x="780" y="480" class="small ink">OUTPUT / 1:1</text>
<text x="704" y="508" class="small rose">CENTER CROP / NO STRETCH</text>

<svg x="575" y="640" width="110" height="44" viewBox="0 0 600 240" preserveAspectRatio="xMidYMid meet">
  <rect width="600" height="240" fill="url(#wideGrad)"/>
  <circle cx="300" cy="120" r="84" fill="#FFEEFF" opacity=".58"/>
  <path d="M0 200L220 70L410 190L600 42V240H0Z" fill="#241B5B" opacity=".8"/>
</svg>
<rect x="575" y="640" width="110" height="44" fill="none" stroke="#847374"/>
<rect x="608" y="640" width="44" height="44" class="guide"/>
<path d="M685 662H704" class="guide"/>
<g clip-path="url(#portraitCropClip)">
  <svg x="704" y="552" width="250" height="250" viewBox="0 0 600 240" preserveAspectRatio="xMidYMid slice">
    <rect width="600" height="240" fill="url(#wideGrad)"/>
    <circle cx="300" cy="120" r="84" fill="#FFEEFF" opacity=".58"/>
    <path d="M0 200L220 70L410 190L600 42V240H0Z" fill="#241B5B" opacity=".8"/>
  </svg>
</g>
<rect x="704" y="552" width="250" height="250" rx="22" fill="none" stroke="#847374" stroke-width="1.5"/>
<text x="575" y="830" class="small ink">WIDE INPUT</text>
<text x="780" y="830" class="small ink">OUTPUT / 1:1</text>
<text x="704" y="858" class="small rose">CENTER CROP / NO LETTERBOX</text>

<!-- 03: loaded, loading, missing and safe error fallback -->
<g clip-path="url(#loadedClip)">
  <rect x="1100" y="205" width="170" height="170" fill="url(#coverBGrad)"/>
  <circle cx="1235" cy="240" r="65" fill="#E6F2FF" opacity=".58"/>
  <path d="M1100 340Q1185 230 1270 295V375H1100Z" fill="#183B59"/>
</g>
<rect x="1100" y="205" width="170" height="170" rx="20" fill="none" stroke="#847374"/>
<text x="1185" y="402" text-anchor="middle" class="label ink">LOADED</text>

<rect x="1360" y="205" width="170" height="170" rx="20" class="loading"/>
<rect x="1390" y="258" width="110" height="14" rx="7" fill="#D7C1C3"/>
<rect x="1415" y="292" width="60" height="14" rx="7" fill="#D7C1C3"/>
<text x="1445" y="402" text-anchor="middle" class="label ink">LOADING / STATIC</text>

<rect x="1100" y="500" width="170" height="170" rx="20" class="missing"/>
<g transform="translate(1143 628) scale(.09)" class="muted"><use href="#albumIcon"/></g>
<text x="1185" y="697" text-anchor="middle" class="label ink">MISSING</text>

<rect x="1360" y="500" width="170" height="170" rx="20" class="missing"/>
<g transform="translate(1403 628) scale(.09)" class="muted"><use href="#albumIcon"/></g>
<text x="1445" y="697" text-anchor="middle" class="label ink">ERROR / SAFE FALLBACK</text>

<line x1="1090" y1="745" x2="1535" y2="745" class="rule"/>
<text x="1090" y="782" class="small ink">ALL STATES / SAME 1:1 + SAME SHAPE</text>
<text x="1090" y="814" class="small ink">NO FILTER · NO RANDOM COLOR · NO LAYOUT SHIFT</text>
<text x="1090" y="846" class="small muted">ADJACENT LABEL → CONTENT DESCRIPTION = NULL</text>

<line x1="30" y1="900" x2="1567" y2="900" class="rule"/>
<text x="35" y="936" class="foot ink">RESONOTE DESIGN SYSTEM</text>
<text x="1565" y="936" text-anchor="end" class="foot ink">ALBUM ARTWORK / RATIO · CROP · SHAPE · STATE</text>
</svg>
