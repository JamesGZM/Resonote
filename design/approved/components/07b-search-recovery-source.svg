  <text x="1545" y="53" class="title" text-anchor="end">07B / SEARCH &amp; RECOVERY</text>
  <text x="1545" y="78" class="small" text-anchor="end">SEARCH · FILTER · EMPTY · ERROR · OFFLINE · PERMISSION</text>
  <line x1="30" y1="96" x2="1567" y2="96" stroke="#847374" stroke-width="1"/>
  <text x="35" y="138" class="section" text-anchor="start">SEARCH ENTRY</text><rect x="35" y="165" width="1527" height="92" rx="46" fill="#F2E5E5" /><svg x="62" y="187" width="48" height="48" viewBox="0 -960 960 960" fill="#524344"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></svg><text x="130" y="218" class="body" text-anchor="start">Search albums, artists, and songs</text><svg x="1482" y="187" width="48" height="48" viewBox="0 -960 960 960" fill="#524344"><path d="M440-160q-17 0-28.5-11.5T400-200v-240L168-736q-15-20-4.5-42t36.5-22h560q26 0 36.5 22t-4.5 42L560-440v240q0 17-11.5 28.5T520-160h-80Zm40-308 198-252H282l198 252Z"/></svg><rect x="35" y="284" width="220" height="52" rx="8" fill="#FFD9DD" /><text x="145" y="316" class="role" text-anchor="middle">DOWNLOADED</text><rect x="275" y="284" width="150" height="52" rx="8" fill="none" stroke="#847374"/><text x="350" y="316" class="role" text-anchor="middle">CLEAR</text><text x="455" y="316" class="small" text-anchor="start">300ms debounce applies to query work only · local input and Clear stay immediate</text><rect x="35" y="390" width="355" height="360" rx="24" fill="#FEF1F1" stroke="#D7C1C3"/><svg x="168" y="432" width="88" height="88" viewBox="0 -960 960 960" fill="#524344"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></svg><text x="212" y="558" class="section" text-anchor="middle">NO RESULTS</text><text x="212" y="595" class="body" text-anchor="middle">Try clearing filters.</text><rect x="109" y="640" width="207" height="56" rx="28" fill="none" stroke="#AE2A4B"/><text x="212" y="674" class="role" text-anchor="middle">CLEAR FILTERS</text><text x="212" y="722" class="meta" text-anchor="middle">RECOVERY PATH REMAINS VISIBLE</text><rect x="425" y="390" width="355" height="360" rx="24" fill="#FEF1F1" stroke="#D7C1C3"/><svg x="558" y="432" width="88" height="88" viewBox="0 -960 960 960" fill="#BA1A1A"><path d="M440-440h80v-240h-80v240Zm40 160q17 0 28.5-11.5T520-320q0-17-11.5-28.5T480-360q-17 0-28.5 11.5T440-320q0 17 11.5 28.5T480-280Zm0 200q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Z"/></svg><text x="602" y="558" class="section" text-anchor="middle">LIBRARY ERROR</text><text x="602" y="595" class="body" text-anchor="middle">The request could not finish.</text><rect x="499" y="640" width="207" height="56" rx="28" fill="#FFD9DD" /><text x="602" y="674" class="role" text-anchor="middle">TRY AGAIN</text><text x="602" y="722" class="meta" text-anchor="middle">RECOVERY PATH REMAINS VISIBLE</text><rect x="815" y="390" width="355" height="360" rx="24" fill="#FEF1F1" stroke="#D7C1C3"/><svg x="948" y="432" width="88" height="88" viewBox="0 -960 960 960" fill="#AE2A4B"><path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z"/></svg><text x="992" y="558" class="section" text-anchor="middle">OFFLINE</text><text x="992" y="595" class="body" text-anchor="middle">Downloaded music is still available.</text><rect x="889" y="640" width="207" height="56" rx="28" fill="#FFD9DD" /><text x="992" y="674" class="role" text-anchor="middle">VIEW DOWNLOADS</text><text x="992" y="722" class="meta" text-anchor="middle">RECOVERY PATH REMAINS VISIBLE</text><rect x="1205" y="390" width="355" height="360" rx="24" fill="#FEF1F1" stroke="#D7C1C3"/><svg x="1338" y="432" width="88" height="88" viewBox="0 -960 960 960" fill="#66558F"><path d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm112-260q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Z"/></svg><text x="1382" y="558" class="section" text-anchor="middle">PERMISSION</text><text x="1382" y="595" class="body" text-anchor="middle">Explain the benefit before asking.</text><rect x="1279" y="640" width="207" height="56" rx="28" fill="#FFD9DD" /><text x="1382" y="674" class="role" text-anchor="middle">OPEN SETTINGS</text><text x="1382" y="722" class="meta" text-anchor="middle">RATIONALE → SYSTEM PROMPT</text><line x1="35" y1="795" x2="1562" y2="795" stroke="#847374" stroke-width="1"/><text x="35" y="835" class="section" text-anchor="start">STATE CONTRACT</text><text x="265" y="835" class="role" text-anchor="start">EMPTY ≠ NO RESULT</text><text x="505" y="835" class="role" text-anchor="start">ERROR ≠ OFFLINE</text><text x="745" y="835" class="role" text-anchor="start">PERMISSION IS CONTEXTUAL</text><text x="1050" y="835" class="role" text-anchor="start">PRIMARY NAV STAYS VISIBLE</text><text x="1325" y="835" class="role" text-anchor="start">EXIT PATH REQUIRED</text><text x="35" y="872" class="small" text-anchor="start">Every state names what happened, preserves context, and offers one clear recovery or exit action.</text>
  <line x1="30" y1="910" x2="1567" y2="910" stroke="#847374" stroke-width="1"/>
  <text x="35" y="946" class="foot" text-anchor="start">RESONOTE DESIGN SYSTEM</text>
